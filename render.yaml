services:
  - type: web
    name: swiftdrop-api
    env: node
    region: frankfurt  # Change to your preferred region (us-east-1, us-west-1, eu-west-1, etc.)
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: swiftdrop-db
          property: connectionString
      - key: POSTMARK_API_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: POSTMARK_FROM_EMAIL
        value: noreply@swiftdrop.co.ke
      - key: POSTMARK_TEMPLATE_ALIAS_PREFIX
        value: swiftdrop
      - key: ADMIN_BYPASS_SECRET
        sync: false  # Set manually in Render dashboard

databases:
  - name: swiftdrop-db
    plan: starter
    region: frankfurt  # Same region as service
    postgresVersion: 15
